name: probe

# 새 출처의 응답 모양을 확인할 때만 쓴다.
# probe/ 로 시작하는 브랜치에 probe_urls.txt 를 올리면 돈다. 허용 목록 밖 주소는 호출되지 않는다.
on:
  push:
    branches: ["probe/**"]
    paths:
      - "probe_urls.txt"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: 응답 확인
        run: python3 scripts/probe.py

      - name: 결과를 이 브랜치에 남김
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe_out || true
          if git diff --cached --quiet; then
            echo "남길 결과 없음"
            exit 0
          fi
          git commit -m "probe: 응답 확인 결과"
          git push
