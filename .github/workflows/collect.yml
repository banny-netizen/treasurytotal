name: collect

on:
  schedule:
    - cron: "37 4 * * 1-6"   # 월~토 13:37 KST — 일별 묶음 (금리, 회의 일정·점도표, 경제지표, 물가 발표, 연체율, 재정, 성장률)
    - cron: "53 4 * * 1"     # 월 13:53 KST — 연준 모델 (주간 보고서)
  workflow_dispatch:
    inputs:
      groups:
        description: "수집할 묶음 또는 출처 (daily, weekly, all, rates ...). 띄어쓰기로 여러 개"
        default: "all"
  push:
    branches: [main]
    paths:
      - "trigger/**"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: 정책 점검
        run: python3 scripts/check_policy.py

      - name: 수집
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GROUPS_INPUT: ${{ inputs.groups }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          case "$SCHEDULE" in
            "37 4 * * 1-6") groups="daily" ;;
            "53 4 * * 1") groups="weekly" ;;
            *) groups="$GROUPS_INPUT" ;;
          esac
          if [ -z "$groups" ] && [ -f trigger/run.txt ]; then
            groups="$(head -n 1 trigger/run.txt | tr -cd 'a-z ')"
          fi
          [ -z "$groups" ] && groups="all"
          echo "수집 대상: $groups"
          python3 scripts/collect.py $groups

      - name: 수집 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "data: $(date -u +%F) 수집"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
